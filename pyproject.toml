[project]
name = "econiq"
version = "0.1.0"
description = "Economic Intelligence for Africa"
readme = "README.md"
authors = [
    { name = "Brandol Ruto", email = "brandolk99@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "certifi>=2026.7.22",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "matplotlib-inline>=0.2.2",
    "nbformat>=5.11.1",
    "numpy>=2.5.2",
    "openai>=3.3.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pdfplumber>=0.11.10",
    "psycopg2-binary>=2.9.12",
    "psycopg[binary]>=3.3.4",
    "pyarrow>=25.0.1",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.16.1",
    "python-dateutil>=2.9.0.post0",
    "python-docx>=1.2.0",
    "qdrant-client>=1.19.0",
    "requests>=2.34.2",
    "sentence-transformers>=6.0.0",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
    "xlrd>=2.0.2",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""
