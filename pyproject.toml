[project]
name = "econiq"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Brandol Ruto", email = "brandolk99@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "certifi>=2026.7.22",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.16.1",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

[project.scripts]
econiq = "econiq:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
